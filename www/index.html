<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آلة حاسبة احترافية</title>
    <style>
        :root {
            --bg-color: #000000;
            --calc-bg: #121212;
            --text-color: #ffffff;
            --secondary-text: #888888;
            --btn-bg: #1e1e1e;
            --btn-hover: #333333;
            --accent-color: #ff9f0a;
            --accent-hover: #ffb340;
            --op-bg: #333333;
            --danger-color: #ff3b30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .calculator {
            width: 100%;
            height: 100%;
            max-width: 500px;
            background-color: var(--calc-bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (min-width: 500px) {
            .calculator {
                height: 90vh;
                border-radius: 30px;
                box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            }
        }

        .modes-bar {
            display: flex;
            padding: 10px 20px;
            gap: 15px;
            margin-top: 10px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--secondary-text);
            font-size: 0.9rem;
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.3s;
            cursor: pointer;
        }

        .mode-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        .display-area {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            min-height: 150px;
        }

        .history-line {
            font-size: 1.2rem;
            color: var(--secondary-text);
            min-height: 1.5rem;
            margin-bottom: 10px;
            word-wrap: break-word;
            text-align: left;
            width: 100%;
            direction: ltr;
        }

        .current-line {
            font-size: 3.5rem;
            font-weight: 300;
            color: var(--text-color);
            word-wrap: break-word;
            width: 100%;
            text-align: left;
            direction: ltr;
            overflow: hidden;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 20px;
            padding-bottom: 40px;
        }

        button {
            border: none;
            outline: none;
            aspect-ratio: 1 / 1;
            font-size: 1.5rem;
            border-radius: 50%;
            cursor: pointer;
            background-color: var(--btn-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s linear, background-color 0.2s;
        }

        button:active {
            transform: scale(0.9);
            background-color: var(--btn-hover);
        }

        .btn-op {
            background-color: var(--op-bg);
            color: var(--accent-color);
            font-weight: 500;
        }

        .btn-action {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-clear {
            color: var(--danger-color);
        }

        .adv-btn {
            display: none;
            font-size: 1.1rem;
            color: #409eff;
        }

        .show-adv .adv-btn {
            display: flex;
        }

        .show-adv .keypad {
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="calculator" id="calcFrame">
        <div class="modes-bar">
            <button class="mode-btn active" onclick="toggleMode('basic', this)">أساسية</button>
            <button class="mode-btn" onclick="toggleMode('adv', this)">متقدمة</button>
        </div>

        <div class="display-area">
            <div class="history-line" id="historyText"></div>
            <div class="current-line" id="currentText">0</div>
        </div>

        <div class="keypad" id="mainKeypad">
            <!-- Advanced -->
            <button class="adv-btn btn-op" onclick="addFunc('Math.sin')">sin</button>
            <button class="adv-btn btn-op" onclick="addFunc('Math.cos')">cos</button>
            <button class="adv-btn btn-op" onclick="addFunc('Math.tan')">tan</button>
            <button class="adv-btn btn-op" onclick="addFunc('Math.sqrt')">√</button>
            <button class="adv-btn btn-op" onclick="addText('**')">xʸ</button>
            <button class="adv-btn btn-op" onclick="addFunc('Math.log10')">log</button>
            <button class="adv-btn btn-op" onclick="addText('Math.PI')">π</button>
            <button class="adv-btn btn-op" onclick="addText('Math.E')">e</button>

            <!-- Basic Row 1 -->
            <button class="btn-clear" onclick="allClear()">C</button>
            <button class="btn-op" onclick="backspace()">⌫</button>
            <button class="btn-op" onclick="addText('%')">%</button>
            <button class="btn-op" onclick="addText('/')">÷</button>

            <!-- Numbers & Operators -->
            <button onclick="addText('7')">7</button>
            <button onclick="addText('8')">8</button>
            <button onclick="addText('9')">9</button>
            <button class="btn-op" onclick="addText('*')">×</button>

            <button onclick="addText('4')">4</button>
            <button onclick="addText('5')">5</button>
            <button onclick="addText('6')">6</button>
            <button class="btn-op" onclick="addText('-')">−</button>

            <button onclick="addText('1')">1</button>
            <button onclick="addText('2')">2</button>
            <button onclick="addText('3')">3</button>
            <button class="btn-op" onclick="addText('+')">+</button>

            <button onclick="addText('00')">00</button>
            <button onclick="addText('0')">0</button>
            <button onclick="addText('.')">.</button>
            <button class="btn-action" onclick="exec()">=</button>
        </div>
    </div>

    <script>
        let expression = '0';
        let isEvaluated = false;
        const currentEl = document.getElementById('currentText');
        const historyEl = document.getElementById('historyText');
        const calcFrame = document.getElementById('calcFrame');

        function updateDisplay() {
            let visibleExpr = expression
                .replace(/\*/g, '×')
                .replace(/\//g, '÷')
                .replace(/\*\*/g, '^')
                .replace(/Math\.PI/g, 'π')
                .replace(/Math\.E/g, 'e')
                .replace(/Math\.sin/g, 'sin')
                .replace(/Math\.cos/g, 'cos')
                .replace(/Math\.tan/g, 'tan')
                .replace(/Math\.sqrt/g, '√')
                .replace(/Math\.log10/g, 'log');
            
            currentEl.innerText = visibleExpr;
            
            // Auto font size scaling
            if (visibleExpr.length > 10) {
                currentEl.style.fontSize = '2rem';
            } else {
                currentEl.style.fontSize = '3.5rem';
            }
        }

        function addText(char) {
            if (isEvaluated) {
                if (!isNaN(char) || char === 'Math.PI' || char === 'Math.E') {
                    expression = char;
                } else {
                    expression += char;
                }
                isEvaluated = false;
            } else {
                if (expression === '0' && char !== '.') {
                    expression = char;
                } else {
                    expression += char;
                }
            }
            updateDisplay();
        }

        function addFunc(func) {
            if (expression === '0' || isEvaluated) {
                expression = func + '(';
                isEvaluated = false;
            } else {
                expression += '*' + func + '(';
            }
            updateDisplay();
        }

        function allClear() {
            expression = '0';
            historyEl.innerText = '';
            isEvaluated = false;
            updateDisplay();
        }

        function backspace() {
            if (expression.length > 1) {
                expression = expression.slice(0, -1);
            } else {
                expression = '0';
            }
            updateDisplay();
        }

        function exec() {
            try {
                let checkExpr = expression;
                // Count open parentheses
                let openP = (checkExpr.match(/\(/g) || []).length;
                let closeP = (checkExpr.match(/\)/g) || []).length;
                while (openP > closeP) {
                    checkExpr += ')';
                    closeP++;
                }

                historyEl.innerText = currentEl.innerText + ' =';
                let result = eval(checkExpr);
                
                if (result === Infinity || isNaN(result)) {
                    throw new Error();
                }

                // Handle precision
                result = Number(Math.round(result + 'e10') + 'e-10');
                expression = result.toString();
                isEvaluated = true;
                updateDisplay();
            } catch (e) {
                currentEl.innerText = "خطأ";
                expression = '0';
                isEvaluated = true;
            }
        }

        function toggleMode(mode, btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (mode === 'adv') {
                calcFrame.classList.add('show-adv');
            } else {
                calcFrame.classList.remove('show-adv');
            }
        }

        // Handle Keyboard Support
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if (!isNaN(key)) addText(key);
            if (key === '+') addText('+');
            if (key === '-') addText('-');
            if (key === '*') addText('*');
            if (key === '/') addText('/');
            if (key === 'Enter' || key === '=') exec();
            if (key === 'Backspace') backspace();
            if (key === 'Escape') allClear();
            if (key === '.') addText('.');
        });
    </script>
</body>
</html>
